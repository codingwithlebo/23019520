name: Part 2 - Build and Test API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore part2/RaceDay.sln

      - name: Build
        run: dotnet build part2/RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test part2/RaceDay.sln --configuration Release --no-build --verbosity normal
