name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "docs folder found"

      - name: Check ERD file exists
        run: |
          if [ ! -f "docs/raceday_erd.png" ]; then
            echo "ERROR: docs/raceday_erd.png is missing"
            exit 1
          fi
          echo "ERD file found"

      - name: Check API endpoint plan exists
        run: |
          if [ ! -f "docs/api-endpoint-plan.md" ]; then
            echo "ERROR: docs/api-endpoint-plan.md is missing"
            exit 1
          fi
          echo "API endpoint plan found"

      - name: Check SQL script exists
        run: |
          if [ ! -f "docs/raceday-schema.sql" ]; then
            echo "ERROR: docs/raceday-schema.sql is missing"
            exit 1
          fi
          echo "SQL script found"

      - name: Check README exists
        run: |
          if [ ! -f "README.md" ]; then
            echo "ERROR: README.md is missing from repository root"
            exit 1
          fi
          echo "README.md found"

      - name: Validate SQL script is not empty
        run: |
          if [ ! -s "docs/raceday-schema.sql" ]; then
            echo "ERROR: SQL script is empty"
            exit 1
          fi
          echo "SQL script contains content"

      - name: Validate API plan is not empty
        run: |
          if [ ! -s "docs/api-endpoint-plan.md" ]; then
            echo "ERROR: API endpoint plan is empty"
            exit 1
          fi
          echo "API endpoint plan contains content"

      - name: All checks passed
        run: |
          echo "Repository structure is valid"
          echo "All required RaceDay documentation files are present"
          echo "CI validation completed successfully"